[project]
name = "meetmux"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Surya Pranav", email = "pranavsurya123@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
]

[project.scripts]
meetmux = "meetmux:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
